        <div class="container">
          <h1 class="title">Cafe Order</h1>
          <p class="description">select your brew</p>
          <div class="dotted-line"></div>
          <p class="timer" id="timer">00:00</p>
          <div class="opt-wrapper" id="optWrapper">
            <div class="option" id="opt-espresso" data-drink="espresso" onclick="chooseBrew('espresso', 15)">
              Espresso
              <p>15 min focus</p>
            </div>
            <div class="option" id="opt-latte" data-drink="latte" onclick="chooseBrew('latte', 25)">
              Latte
              <p>25 min focus</p>
            </div>
            <div class="option" id="opt-matcha" data-drink="matcha" onclick="chooseBrew('matcha', 45)">
              Matcha
              <p>45 min focus</p>
            </div>
          </div>

          <div class="active-session" id="activeSession">
            <div class="brew-icon pulse" id="brewIcon">☕</div>
            <div class="brew-name" id="brewName">Espresso</div>
            <div class="control-row">
              <button id="pauseBtn" onclick="togglePause()">Pause</button>
              <button id="stopBtn" onclick="stopBrew()">Stop</button>
            </div>
          </div>

          <div class="bottom-dotted-line"></div>

        </div>
        <footer>
          <p>CAFE FOCUS</p>
        </footer>

        <script src="index.js">
        </script>
      </body>

      </html> id="timer">
      <span id="days"></span>
      <span class="timer-unit">Days</span>
      <span id="hours"></span>
      <span class="timer-unit">Hours</span>
      <span id="minutes"></span>
      <span class="timer-unit">Minutes</span>
      <span id="seconds"></span>
      <span class="timer-unit">Seconds</span>
      </p>
